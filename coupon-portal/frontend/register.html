<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Coupon Portal</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:460px">
    <div class="auth-logo">
      <div class="logo-icon">🎫</div>
      <span>CouponPortal</span>
    </div>

    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Register to start requesting course coupons</p>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label">Full name</label>
        <input type="text" id="name" class="form-control"
               placeholder="John Doe" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" id="email" class="form-control"
               placeholder="you@company.com" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control"
               placeholder="Min. 6 characters" required minlength="6"/>
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select id="role" class="form-control" required>
          <option value="">Select role…</option>
          <option value="USER">Employee (User)</option>
          <option value="MANAGER">Manager</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Tenant ID</label>
        <input type="number" id="tenantId" class="form-control"
               placeholder="e.g. 1" required min="1"/>
        <small style="color:var(--text-muted);font-size:0.78rem;margin-top:4px;display:block">
          Ask your admin for the Tenant ID of your organization
        </small>
      </div>
      <button type="submit" class="btn btn-primary" id="register-btn">
        Create account
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('register-btn');
    btn.textContent = 'Creating account…';
    btn.disabled = true;

    const data = await api.post('/api/auth/register', {
      name:     document.getElementById('name').value.trim(),
      email:    document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      role:     document.getElementById('role').value,
      tenantId: parseInt(document.getElementById('tenantId').value),
    });

    btn.textContent = 'Create account';
    btn.disabled = false;

    if (!data) return;

    if (data.success) {
      localStorage.setItem('accessToken',  data.data.accessToken);
      localStorage.setItem('refreshToken', data.data.refreshToken);
      localStorage.setItem('user', JSON.stringify(data.data));
      toast('Account created successfully!');
      const role = data.data.role;
      setTimeout(() => {
        if (role === 'ADMIN')        window.location.href = 'admin.html';
        else if (role === 'MANAGER') window.location.href = 'manager.html';
        else                         window.location.href = 'user.html';
      }, 800);
    } else {
      toast(data.message || 'Registration failed', 'error');
    }
  });
</script>
</body>
</html>
