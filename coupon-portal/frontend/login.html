<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Coupon Portal</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🎫</div>
      <span>CouponPortal</span>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your account to continue</p>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" id="email" class="form-control"
               placeholder="you@company.com" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control"
               placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">
        Sign in
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="register.html">Register</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // Redirect if already logged in
  if (getToken()) {
    const user = getUser();
    if (user?.role === 'ADMIN')   window.location.href = 'admin.html';
    else if (user?.role === 'MANAGER') window.location.href = 'manager.html';
    else window.location.href = 'user.html';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.textContent = 'Signing in…';
    btn.disabled = true;

    const data = await api.post('/api/auth/login', {
      email:    document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });

    btn.textContent = 'Sign in';
    btn.disabled = false;

    if (!data) return;

    if (data.success) {
      localStorage.setItem('accessToken',  data.data.accessToken);
      localStorage.setItem('refreshToken', data.data.refreshToken);
      localStorage.setItem('user', JSON.stringify(data.data));

      const role = data.data.role;
      if (role === 'ADMIN')   window.location.href = 'admin.html';
      else if (role === 'MANAGER') window.location.href = 'manager.html';
      else window.location.href = 'user.html';
    } else {
      toast(data.message || 'Invalid credentials', 'error');
    }
  });
</script>
</body>
</html>
