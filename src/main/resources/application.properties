# ── Application ───────────────────────────────────────────
spring.application.name=coupon-portal

# ── Database ───────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/coupon_portal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=kiit
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────
# --after tables are created change update->validate
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ─────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Mail (SMTP - Gmail) ────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Thymeleaf ──────────────────────────────────────────────
spring.thymeleaf.prefix=classpath:/templates/mail/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ── Cache ──────────────────────────────────────────────────
spring.cache.type=simple

# ── Server ─────────────────────────────────────────────────
server.port=8080

# ── JWT (custom properties) ────────────────────────────────
jwt.secret=4e6f7468696e675f536563726574215f4e6f7468696e675f536563726574215f
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

# ── App custom properties ──────────────────────────────────
app.frontend-url=http://localhost:3000
app.tenant-header=X-Tenant-ID

# ── Actuator ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── Logging ────────────────────────────────────────────────
logging.level.com.couponportal=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
